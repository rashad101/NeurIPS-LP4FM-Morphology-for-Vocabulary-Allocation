[project]
name = "morphtok"
version = "0.1.0"
description = "Morphology, Not Frequency, Should Govern Vocabulary Allocation — experiment code (LP4FM @ NeurIPS 2026 position paper)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Md Rashad Al Hasan Rony" }]

dependencies = [
    # numerics / io
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "regex>=2023.12",
    "tabulate>=0.9",
    # tokenizers
    # transformers is pinned below 5 for vLLM compatibility and because the
    # byte-level (ByT5) tokenizer path relies on the v4 slow-tokenizer API
    "transformers>=4.45,<5",
    "tokenizers>=0.20,<0.22",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "tiktoken>=0.7",
    "huggingface-hub>=0.25",
    "datasets>=2.20",
    "jinja2>=3.1",  # chat templates in Part C prompts
    # morphology
    "morfessor>=2.0.6",
    # figures
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Part C on the 48GB GPU box: `uv sync --extra gpu`
gpu = [
    "torch>=2.4",
    "vllm>=0.6.0",
    "accelerate>=0.34",
]
dev = ["pytest>=8.0"]
# CPU-only smoke testing of Part C (small model through transformers)
cpu-infer = [
    "torch>=2.4",
    "accelerate>=0.34",
]

[project.scripts]
morphtok = "morphtok.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morphtok"]

[tool.uv]
# keep every byte inside the repo
cache-keys = [{ file = "pyproject.toml" }]
